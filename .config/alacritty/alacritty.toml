[general]
import = [
  "~/.config/alacritty/platform.toml",
  "~/.config/alacritty/monokai-theme.toml"
]

[terminal.shell]
# Prefer zsh when installed, otherwise fall back to the user's default shell
program = "/bin/sh"
args = ["-c", "if command -v zsh >/dev/null 2>&1; then exec fish -l; else exec \"${SHELL:-/bin/sh}\" -l; fi"]

[window]
opacity = 1.0
decorations = "Full"
decorations_theme_variant = "Dark"
padding = { x = 6, y = 0 }
dynamic_padding = true

[scrolling]
history = 3023

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500
unfocused_hollow = true

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = false

[bell]
duration = 0

[keyboard]
bindings = [
  { key = "C",       mods = "Control|Shift", action = "Copy"  },
  { key = "V",       mods = "Control|Shift", action = "Paste" },
  { key = "N",       mods = "Control|Shift", action = "SpawnNewInstance" },
  { key = "Equals",  mods = "Control|Shift", action = "IncreaseFontSize" },
  { key = "Minus",   mods = "Control",       action = "DecreaseFontSize" },
  { key = "Key0",    mods = "Control",       action = "ResetFontSize"    },
  { key = "Enter",   mods = "Shift",         chars = "\n" },
]
