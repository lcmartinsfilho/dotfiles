# True color (alacritty advertises RGB; the fallback covers other terminals).
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10

# Dracula (matches alacritty)
# background #1a1b23  current-line #44475a  comment #6272a4  foreground #f8f8f2
# purple #bd93f9  pink #ff79c6  cyan #8be9fd  green #50fa7b  orange #ffb86c  red #ff5555  yellow #f1fa8c

set -g status-style "bg=#50fa7b,fg=#000000"
set -g status-left-length 40
set -g status-left "#[bg=#1a1b23,fg=#50fa7b,bold] #S #[default] "
set -g status-right "#[fg=#000000]%a %d %b  #[bg=#1a1b23,fg=#50fa7b,bold] %H:%M "

set -g window-status-format " #I #W "
set -g window-status-style "fg=#000000"
set -g window-status-current-format " #I #W "
set -g window-status-current-style "bg=#1a1b23,fg=#f8f8f2,bold"
set -g window-status-activity-style "fg=#000000,underscore"
set -g window-status-bell-style "bg=#ff5555,fg=#000000"

set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#bd93f9"
set -g display-panes-colour "#6272a4"
set -g display-panes-active-colour "#ff79c6"

set -g message-style "bg=#44475a,fg=#f8f8f2"
set -g message-command-style "bg=#44475a,fg=#f1fa8c"
set -g mode-style "bg=#44475a,fg=#f8f8f2"
set -g clock-mode-colour "#bd93f9"
