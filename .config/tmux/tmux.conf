# True color (alacritty advertises RGB; the fallback covers other terminals).
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10

# Catppuccin Mocha
# rosewater #f5e0dc  pink #f5c2e7  mauve #cba6f7  red #f38ba8  peach #fab387  yellow #f9e2af
# green #a6e3a1  teal #94e2d5  sapphire #74c7ec  blue #89b4fa  lavender #b4befe
# text #cdd6f4  subtext0 #a6adc8  overlay0 #6c7086  surface1 #45475a  surface0 #313244  base #1e1e2e  mantle #181825

set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#181825,bold] #S #[default] "
set -g status-right "#[fg=#a6adc8]%a %d %b  #[bg=#313244,fg=#cdd6f4] %H:%M "

set -g window-status-format " #I #W "
set -g window-status-style "fg=#6c7086"
set -g window-status-current-format " #I #W "
set -g window-status-current-style "bg=#313244,fg=#f5c2e7,bold"
set -g window-status-activity-style "fg=#fab387"
set -g window-status-bell-style "fg=#f38ba8"

set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g display-panes-colour "#6c7086"
set -g display-panes-active-colour "#f5c2e7"

set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#f9e2af"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
set -g clock-mode-colour "#89b4fa"
